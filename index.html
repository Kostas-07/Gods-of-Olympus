<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Οι 12 Θεοί του Ολύμπου</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">Παιχνίδι γνώσεων</p>
      <h1>Οι 12 Θεοί του Ολύμπου</h1>
      <p class="intro">Απάντησε σωστά και στους 5 γρίφους κάθε θεού για να ξεκλειδώσεις τον επόμενο!</p>
    </header>

    <section class="panel" id="game">
      <div class="topline">
        <span id="levelLabel">Θεός 1 από 12</span>
        <span id="scoreLabel">Ερώτηση 1 από 5</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <h2 id="godName"></h2>
      <p id="godDescription" class="muted"></p>
      <h3 id="question"></h3>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="nextButton" class="primary" disabled>Επόμενη ερώτηση</button>
    </section>

    <section class="panel hidden" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button id="retryButton" class="primary hidden">Επανάληψη θεού</button>
      <button id="continueButton" class="primary hidden">Επόμενος θεός</button>
      <button id="restartButton" class="secondary hidden">Παίξε ξανά από την αρχή</button>
    </section>
    <footer>Καλή επιτυχία, ήρωα!</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
